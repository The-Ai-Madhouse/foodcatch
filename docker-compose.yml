# Local development database. Production uses Neon (see docs/setup.md).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: foodcatch
      POSTGRES_PASSWORD: foodcatch
      POSTGRES_DB: foodcatch
    ports:
      # Loopback only: the superuser password is public in this repository.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodcatch -d foodcatch"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
