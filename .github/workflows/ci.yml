name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: pipeline (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: foodcatch
          POSTGRES_PASSWORD: foodcatch
          POSTGRES_DB: foodcatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodcatch -d foodcatch"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgresql+psycopg://foodcatch:foodcatch@localhost:5432/postgres
      FOODCATCH_ENV_FILE: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing:skip-covered

  web:
    name: web (Next.js)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # hashFiles() is not available in job-level `if`, so every step is guarded instead:
    # the job is a no-op until web/package.json exists.
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Skip notice
        if: hashFiles('web/package.json') == ''
        working-directory: .
        run: echo "web/package.json not found - skipping web checks."

      # pnpm version comes from the "packageManager" field in web/package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: hashFiles('web/package.json') != ''
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('web/package.json') != ''
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        if: hashFiles('web/package.json') != ''
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: hashFiles('web/package.json') != ''
        run: pnpm lint

      - name: Type check
        if: hashFiles('web/package.json') != ''
        run: pnpm typecheck

      - name: Test
        if: hashFiles('web/package.json') != ''
        run: pnpm test

      - name: Build
        if: hashFiles('web/package.json') != ''
        run: pnpm build
