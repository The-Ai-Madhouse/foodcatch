# Keep scheduled workflows alive.
#
# GitHub disables scheduled workflows in public repositories after 60 days without repository
# activity, silently stopping data collection (and price history cannot be recovered later).
# Once a month this workflow calls the "enable workflow" REST endpoint for every workflow that is
# active or was disabled for inactivity, which resets the inactivity timer - for itself too.
# Workflows a person disabled on purpose (state `disabled_manually`) are left alone.

name: keepalive

on:
  schedule:
    - cron: "41 4 1 * *" # 04:41 UTC on the 1st of every month (well inside 60 days)
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    name: enable scheduled workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # PUT /repos/{owner}/{repo}/actions/workflows/{id}/enable
    steps:
      - name: Enable workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          workflows=$(gh api --paginate "repos/$REPO/actions/workflows" \
            --jq '.workflows[] | [.id, .state, .path] | @tsv')
          {
            echo "| Workflow | State before | Action |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r id state path; do
            [[ -n "$id" ]] || continue
            case "$state" in
              active|disabled_inactivity)
                gh api --method PUT "repos/$REPO/actions/workflows/$id/enable" --silent
                action="enabled"
                if [[ "$state" == disabled_inactivity ]]; then
                  echo "::warning::$path had been disabled for inactivity and was re-enabled."
                fi
                ;;
              *)
                action="left alone"
                ;;
            esac
            echo "$path: $state -> $action"
            echo "| \`$path\` | $state | $action |" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$workflows"
