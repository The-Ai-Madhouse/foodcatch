[project]
name = "foodcatch"
version = "0.1.0"
description = "Data pipeline for FoodCatch: finds genuinely cheap, healthy staple groceries in Denmark."
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [{ name = "FoodCatch contributors" }]
dependencies = [
    "alembic>=1.14",
    "boto3>=1.35",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "sentry-sdk>=2.19",
    "sqlalchemy>=2.0.36",
    "structlog>=24.4",
    "tenacity>=9.0",
    "typer>=0.15",
]

[project.scripts]
foodcatch = "foodcatch.cli:main"

[project.urls]
Repository = "https://github.com/toke-dk/foodcatch"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.35",
    "moto[s3]>=5.0",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foodcatch"]

[tool.uv]
default-groups = ["dev"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "C4",       # comprehensions
    "PT",       # pytest style
    "PTH",      # pathlib
    "T20",      # print outside the CLI
    "BLE",      # blind except
    "S",        # bandit (security)
    "DTZ",      # timezone-aware datetimes
    "N",        # naming
    "RET",      # return statements
    "TID",      # tidy imports
]
ignore = [
    "S101",     # assert is fine in tests and for type narrowing
    "S608",     # SQL is built from constants only; reviewed manually
    "RUF001", "RUF002", "RUF003",  # Danish text contains ambiguous-looking characters
]

[tool.ruff.lint.per-file-ignores]
"src/foodcatch/cli.py" = ["T20"]
"tests/**" = ["S105", "S106", "S311", "N802"]
"src/foodcatch/db/migrations/**" = ["N999"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

# ------------------------------------------------------------------------- pyright
[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "warning"

# -------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error", "ignore::DeprecationWarning:botocore.*", "ignore::DeprecationWarning:moto.*"]
markers = [
    "db: needs a PostgreSQL server (TEST_DATABASE_ADMIN_URL)",
]

[tool.coverage.run]
source = ["foodcatch"]
branch = true

[tool.coverage.report]
skip_empty = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
