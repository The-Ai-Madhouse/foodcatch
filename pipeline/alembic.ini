# Alembic configuration for the FoodCatch pipeline.
# Prefer `uv run foodcatch db upgrade`; plain `uv run alembic ...` also works from pipeline/.
# The database URL comes from DATABASE_URL (environment or .env), never from this file.

[alembic]
script_location = %(here)s/src/foodcatch/db/migrations
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
